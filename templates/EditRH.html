<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

  
    <link rel="stylesheet" href="{{ url_for('static', filename='edit.css') }}">


    <title>Edição regras</title>
    <script src="{{ url_for('static', filename='js/EditRh.js') }}" defer></script>
</head>

<body>
    <header>
        <div class="container">
            <div class="logo">
                <h1>MetroForm</h1>
            </div>
        </div>
    </header>

    <section class="banner">
        <div class="container">
            <h2>Painel de Controle</h2>
            <p>Gerencie perguntas, respostas, pontuações e nota de corte do processo seletivo.</p>
        </div>
    </section>

    <div class="container">
        <div class="painel"></div>
    </div>

    <div id="dados-config-backend" data-config='{{ config | tojson | safe }}' style="display: none;"></div>

    <div class="container" style="margin-top: 15px;">
        <form action="/salvar-regras" method="POST" id="form-regras" onsubmit="prepararEnvio(event)">

            <div class="nota-corte">
                <div class="nota-corte-input-group">
                    <label for="nota_de_corte">Nota de Corte</label>
                    <input class="campo-numero" type="number" id="nota_de_corte" name="nota_de_corte" required>
                </div>
                <span class="nota-corte-info">Pontos mínimos para classificação automática.</span>
            </div>

            <div id="container-perguntas"></div>

            <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;">

            <div class="acoes">
                <button type="button" class="btn btn-voltar" onclick="history.back()">Voltar</button>
                <button type="button" class="btn btn-sucesso" onclick="adicionarNovaPergunta()">
                    + Adicionar Nova Pergunta
                </button>
                <button type="submit" class="btn btn-primario">
                    💾 Salvar Todas as Alterações
                </button>
            </div>

            <input type="hidden" name="config_json" id="config_json_oculto">
        </form>
    </div>
    


</body>

</html>
